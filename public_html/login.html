<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Estación de Tren</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>

    <div class="login-card">
        <h2>Acceso al Sistema</h2>
        <p>Estación de Tren</p>
        
        <form id="formLogin">
            <label for="usuario">Usuario:</label>
            <input type="text" id="usuario" placeholder="Ej. admin" required>

            <label for="password">Contraseña:</label>
            <input type="password" id="password" placeholder="Contraseña" required>

            <button type="submit">Iniciar Sesión</button>
            <p id="errorLogin" class="error-msg" style="color: #ff6b6b; display: none; margin-top: 10px;">Usuario o contraseña incorrectos.</p>
        </form>
    </div>

    <script src="login.js"></script>
</body>
</html>
